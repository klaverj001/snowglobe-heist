<title>The Snowglobe Heist</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@400;700;900&display=swap">
<style>
/* Layout: a night-time heist map. Sidekick mode = huge picture buttons, one task per screen, boss speech bubble on top. Detectives mode = a scrolling case board. Single deliberate night look; the boss's colour tints the sidekick screens. */
:root{
  --night:#0b1424; --night-2:#14213a; --night-3:#1d2d4d; --snow:#eef4fb; --snow-dim:#9fb0c8;
  --holly:#d33a3a; --gold:#f2c14e; --mint:#5fd3a5; --line:rgba(238,244,251,.14);
  --boss:#8e5bd6;
  --display:"Luckiest Guy", "Arial Rounded MT Bold", system-ui, sans-serif; --body:"Nunito", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:radial-gradient(110% 70% at 50% -10%, color-mix(in srgb, var(--boss) 35%, var(--night-2)) 0%, var(--night) 65%) fixed, var(--night);color:var(--snow);font-family:var(--body);font-size:18px;line-height:1.5;-webkit-tap-highlight-color:transparent}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 40px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.02em;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(2.2rem,8vw,4rem)}
h2{font-size:clamp(1.6rem,5vw,2.4rem)}
h3{font-size:1.35rem}
p{margin:0}
.muted{color:var(--snow-dim)}
.small{font-size:.9rem}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
button{font:inherit;cursor:pointer;border:0;color:inherit;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.btn{background:var(--holly);color:#fff;border-radius:999px;padding:14px 26px;font-weight:900;font-size:1.1rem}
.btn-gold{background:var(--gold);color:#2a1d00;border-radius:999px;padding:14px 26px;font-weight:900;font-size:1.1rem}
.btn-ghost{background:transparent;border:2px solid var(--line);border-radius:999px;padding:10px 18px;font-weight:700}
.btn:disabled,.btn-gold:disabled{opacity:.45;cursor:not-allowed}
.panel{background:rgba(20,33,58,.82);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}

/* Mode select */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.modes{grid-template-columns:1fr}}
.mode{background:var(--night-2);border:2px solid var(--line);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:left}
.mode .big{font-size:3.4rem;line-height:1}
.mode:hover{border-color:var(--gold)}

/* Boss bubble */
.boss-bar{display:flex;gap:14px;align-items:flex-start}
.boss-face{flex:none;width:76px;height:76px;border-radius:50%;background:var(--boss);display:grid;place-items:center;font-size:2.6rem;box-shadow:0 0 0 4px rgba(255,255,255,.12),0 8px 20px rgba(0,0,0,.4)}
.art{display:block;object-fit:cover;border-radius:inherit}
.boss-face .art,.boss-face .portrait{width:100%;height:100%;border-radius:50%;overflow:hidden;display:block}
.portrait svg{width:100%;height:100%;display:block}
.bosscard .portrait{width:96px;height:96px;border-radius:18px;overflow:hidden;display:block;max-width:100%}
.sus button .portrait{width:56px;height:56px;border-radius:12px;overflow:hidden;display:block}
.globe .portrait.big{width:70%;height:70%;border-radius:50%;overflow:hidden;display:block;position:relative;z-index:1}
.talkbar .mini{width:2.4rem;height:2.4rem;border-radius:50%;overflow:hidden;display:block}
.talkbar .mini .art,.talkbar .mini .portrait{width:100%;height:100%;display:block}
.bosscard .art{width:96px;height:96px;border-radius:18px;max-width:100%}
.sus button .art{width:56px;height:56px;border-radius:12px}
.globe .art.big{width:70%;height:70%;border-radius:50%;position:relative;z-index:1}
.boss-bar{align-items:center;justify-content:space-between}
.boss-face.big{width:120px;height:120px;padding:0;border:0;cursor:pointer;position:relative;font-size:3.6rem;overflow:visible}
.boss-face.big .art,.boss-face.big .portrait{border-radius:50%;overflow:hidden}
.boss-face.boing{animation:boing .4s}
@keyframes boing{30%{transform:scale(1.15) rotate(-6deg)}60%{transform:scale(.95) rotate(4deg)}}
.waves{position:absolute;right:-34px;top:50%;transform:translateY(-50%);display:flex;gap:4px;opacity:0;transition:opacity .2s}
.boss-face.talking .waves{opacity:1}
.waves i{display:block;width:6px;height:18px;border-radius:3px;background:var(--gold);animation:wave .5s ease-in-out infinite alternate}
.waves i:nth-child(2){animation-delay:.15s;height:28px}.waves i:nth-child(3){animation-delay:.3s}
@keyframes wave{to{transform:scaleY(.4)}}
.againbtn{width:84px;height:84px;border-radius:50%;background:var(--night-2);border:3px solid var(--line);font-size:2.4rem}
.boss-face.talking{animation:bob .35s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-4px) scale(1.04)}}
.bubble{position:relative;background:var(--snow);color:#16213a;border-radius:18px;padding:14px 16px;flex:1;min-width:0;font-weight:700;font-size:1.05rem}
.bubble .who{display:block;font-family:var(--display);font-weight:400;color:var(--boss);font-size:1rem;letter-spacing:.04em}
.replay{background:none;color:#16213a;font-size:1.4rem;padding:0 0 0 6px;vertical-align:middle}

/* Map */
.map{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.stop{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;background:var(--night-3);border:2px solid var(--line);opacity:.55}
.stop.done{background:var(--mint);opacity:1;border-color:transparent}
.stop.now{opacity:1;border-color:var(--gold);box-shadow:0 0 0 4px rgba(242,193,78,.25)}
.stop.help{border-style:dashed}
.dash{width:10px;height:3px;background:var(--line);border-radius:2px}

/* Boss picker */
.bosses{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.bosscard{position:relative;border-radius:20px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;font-weight:900;border:4px solid transparent;min-height:150px;justify-content:center}
.bosscard .e{font-size:3.4rem;line-height:1}
.bosscard[aria-pressed=true]{border-color:#fff;box-shadow:0 0 0 6px rgba(255,255,255,.2)}

/* Puzzles */
.stage{display:flex;flex-direction:column;gap:16px;align-items:center}
.title-row{display:flex;align-items:center;gap:12px;align-self:stretch}
.title-row .ic{font-size:2.6rem}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:560px}
.mcard{aspect-ratio:3/4;border-radius:14px;background:var(--boss);font-size:clamp(2rem,9vw,3.4rem);display:grid;place-items:center;transition:transform .25s;max-width:100%;box-shadow:inset 0 0 0 3px rgba(255,255,255,.18)}
.mcard .back{font-size:1.6rem;opacity:.65}
.mcard.up{background:var(--snow);transform:rotateY(180deg) scaleX(-1)}
.mcard.got{background:var(--mint);transform:none}
.simon{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%;max-width:420px}
.orn{aspect-ratio:1;border-radius:50%;max-width:100%;opacity:.55;transition:opacity .12s,transform .12s;box-shadow:inset -10px -14px 0 rgba(0,0,0,.18), inset 8px 10px 0 rgba(255,255,255,.18)}
.orn.lit{opacity:1;transform:scale(1.06);box-shadow:0 0 30px currentColor, inset -10px -14px 0 rgba(0,0,0,.18)}
.find{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:100%;max-width:560px}
.find button{aspect-ratio:1;font-size:clamp(1.5rem,7vw,2.6rem);background:var(--night-2);border-radius:12px;max-width:100%}
.find button.wrong{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pattern{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:clamp(2.2rem,9vw,3.6rem)}
.pattern .q{width:1.3em;height:1.3em;border:4px dashed var(--gold);border-radius:14px;display:grid;place-items:center;font-size:.8em;color:var(--gold)}
.pattern .q.solved{position:relative;font-size:1em;border:4px solid #3fd34a;background:rgba(63,211,74,.25);box-shadow:0 0 24px rgba(63,211,74,.7);animation:qpop .5s cubic-bezier(.3,1.7,.5,1)}
.pattern .q.solved::after{content:"✔";position:absolute;top:-14px;right:-14px;font-size:1.1rem;background:#3fd34a;color:#fff;border:3px solid #fff;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
@keyframes qpop{from{transform:scale(.2) rotate(-20deg)}70%{transform:scale(1.25)}}
.pattern.done span{animation:qwave .6s ease-in-out}.pattern.done span:nth-child(2){animation-delay:.08s}.pattern.done span:nth-child(3){animation-delay:.16s}.pattern.done span:nth-child(4){animation-delay:.24s}.pattern.done span:nth-child(5){animation-delay:.32s}.pattern.done span:nth-child(6){animation-delay:.4s}
@keyframes qwave{50%{transform:translateY(-14px) scale(1.12)}}
.choices button.right{border-color:#3fd34a!important;background:rgba(63,211,74,.3)!important}.choices button.faded{opacity:.3}
.choices{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.choices button{font-size:clamp(2.4rem,10vw,3.6rem);background:var(--night-2);border:3px solid var(--line);border-radius:20px;width:clamp(84px,24vw,120px);aspect-ratio:1;max-width:100%}
.choices button.wrong{animation:shake .3s;border-color:var(--holly)}
.helpcard{background:var(--snow);color:#16213a;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;width:100%;max-width:560px}
.helpcard .grownup{font-family:var(--display);color:var(--holly);font-size:1.4rem}
.helpcard .word{font-family:var(--display);font-size:clamp(2.6rem,11vw,4.5rem);letter-spacing:.08em;color:#16213a}
.helpcard .riddle{font-size:1.25rem;font-weight:700}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:420px}
.nums button{font-family:var(--display);font-size:2rem;background:var(--night-2);border-radius:16px;aspect-ratio:1;border:3px solid var(--line);max-width:100%}
.slots{display:flex;gap:10px;justify-content:center}
.slot{width:clamp(60px,18vw,90px);aspect-ratio:1;border:3px dashed var(--gold);border-radius:16px;display:grid;place-items:center;font-size:clamp(2rem,9vw,3rem);background:rgba(255,255,255,.06);max-width:100%}
.helpcard .slot{border-color:#16213a}
.snowgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:480px}
.snowgrid button{background:var(--night-2);border:3px solid var(--line);border-radius:16px;padding:6px;max-width:100%}
.snowgrid button.wrong{animation:shake .3s;border-color:var(--holly)}
.snowgrid svg{width:100%;height:auto;display:block}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:360px;margin:0 auto}
.lgrid>*{aspect-ratio:1;border-radius:14px;background:var(--night-3);border:3px solid var(--line);max-width:100%}
.helpcard .lgrid>*{background:#dfe6ef;border-color:#c5cfdb}
.lgrid>.on{box-shadow:0 0 18px currentColor;border-color:#fff}
.lvl{width:100%;max-width:860px;display:flex;flex-direction:column;gap:10px;touch-action:none;-webkit-user-select:none;user-select:none}
.lvl canvas{width:100%;height:auto;aspect-ratio:16/9;border-radius:16px;background:#000;touch-action:none;display:block;max-width:100%}
.lvl-bar{height:14px;border-radius:7px;background:var(--night-3);overflow:hidden}
.lvl-fill{height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--gold));transition:width .2s}
/* controller */
.stick{position:relative;width:190px;height:190px;flex:none;touch-action:none;-webkit-user-select:none;user-select:none}
.stick.ghost{visibility:hidden}
.sbase{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 45%,#2e3858,#1a2038 70%);border:4px solid #3e4a70;box-shadow:inset 0 6px 14px rgba(0,0,0,.5),0 6px 14px rgba(0,0,0,.35);pointer-events:none}
.sarr{position:absolute;color:#5a6a98;font-size:1.2rem;pointer-events:none}
.sarr.up{top:8px;left:50%;transform:translateX(-50%)}.sarr.down{bottom:8px;left:50%;transform:translateX(-50%)}
.sarr.left{left:10px;top:50%;transform:translateY(-50%)}.sarr.right{right:10px;top:50%;transform:translateY(-50%)}
.sarr.off{opacity:0}.sarr.on{color:var(--gold)}
.knob{position:absolute;left:50%;top:50%;width:44%;height:44%;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 38% 32%,#8a96c8,#4a5788 60%,#36406a);border:3px solid #9aa6d8;box-shadow:0 6px 10px rgba(0,0,0,.45);pointer-events:none;transition:transform .12s ease-out}
.knob.held{transition:none;box-shadow:0 2px 6px rgba(0,0,0,.45),0 0 0 6px rgba(242,193,78,.25)}
.console{display:flex;align-items:center;justify-content:center;gap:18px;width:100%}
.console canvas{flex:0 1 auto;min-width:0}
.dpad{position:relative;width:176px;height:176px;flex:none;touch-action:none;-webkit-user-select:none;user-select:none}
.dpad.ghost,.abtn.ghost{visibility:hidden}
.dp{position:absolute;width:60px;height:60px;display:grid;place-items:center;font-size:1.6rem;color:#cfd6e6;background:#2a3350;border:3px solid #3e4a70;box-shadow:inset 0 -5px 0 rgba(0,0,0,.35);pointer-events:none}
.dp.up{left:58px;top:0;border-radius:14px 14px 4px 4px}.dp.down{left:58px;bottom:0;border-radius:4px 4px 14px 14px}
.dp.left{left:0;top:58px;border-radius:14px 4px 4px 14px}.dp.right{right:0;top:58px;border-radius:4px 14px 14px 4px}
.dp.mid{left:58px;top:58px;border-radius:4px;background:#252d48;border-color:#2a3350}
.dp.off{opacity:.25}
.dp.on{background:var(--gold);color:#2a1d00;transform:translateY(2px);box-shadow:none}
.abtn{width:128px;height:128px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#ff6a6a,#c8102e 70%);color:#fff;border:5px solid #7a0a1a;box-shadow:0 8px 0 #5a0610,0 12px 18px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;-webkit-user-select:none;user-select:none}
.abtn b{font-family:var(--display);font-size:clamp(1.8rem,4.5vmin,2.6rem);line-height:1}
.abtn small{font-weight:900;font-size:.8rem;letter-spacing:.06em}
.abtn.on{transform:translateY(6px);box-shadow:0 2px 0 #5a0610}
.lvl.overlay .console{position:relative;display:block;width:fit-content;max-width:100%;margin:0 auto}
.lvl.overlay .console canvas{display:block}
.lvl.overlay .stick{position:absolute;left:3%;bottom:5%;opacity:.55;transition:opacity .15s;margin:0}
.lvl.overlay .abtn{position:absolute;right:3%;bottom:6%;opacity:.6;transition:opacity .15s;margin:0}
.bbtn{position:absolute;right:4%;z-index:4;border-radius:50%;border:5px solid #3a2a6a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;-webkit-user-select:none;user-select:none;opacity:.55;
  background:conic-gradient(#b06aff calc(var(--p,0)*1turn),rgba(40,30,70,.85) 0);box-shadow:0 6px 0 #20103a}
.bbtn b{font-size:clamp(1.3rem,3.5vmin,2rem);line-height:1}.bbtn small{font-weight:900;font-size:.65rem;letter-spacing:.06em}
.bbtn.ready{opacity:1;animation:bpulse .6s ease-in-out infinite alternate;background:radial-gradient(circle at 35% 30%,#e2a6ff,#8a2ae2 70%)}
@keyframes bpulse{from{transform:scale(1);box-shadow:0 0 0 0 rgba(200,120,255,.7)}to{transform:scale(1.1);box-shadow:0 0 0 14px rgba(200,120,255,0)}}
.zone{position:absolute;top:0;bottom:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;z-index:2}
.zone.zl{left:0;width:55%}.zone.zl.full{width:100%}.zone.zr{right:0;width:45%}
.lvl.overlay .console:has(.zone) .stick,.lvl.overlay .console:has(.zone) .abtn{pointer-events:none}
.lvl.overlay .stick.float{transition:none}
.lvl.overlay .stick:active,.lvl.overlay .stick:has(.knob.held),.lvl.overlay .abtn.on{opacity:.95}
.lvl.overlay .sbase{background:radial-gradient(circle at 50% 45%,rgba(46,56,88,.75),rgba(26,32,56,.75) 70%)}
.lvl.port.padded .console{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"cv cv" "dp ab";justify-items:center;row-gap:16px}
.lvl.port.padded .console canvas{grid-area:cv}
.lvl.port.padded .stick{grid-area:dp;justify-self:start;margin-left:8px}
.lvl.port.padded .abtn{grid-area:ab;justify-self:end;margin-right:12px}
.lvl.land .console{gap:24px}

.lvl-ctrl{display:flex;gap:12px;justify-content:space-between}
.lvl-ctrl button{flex:1;min-height:76px;font-size:2rem;font-weight:900;border-radius:20px;background:var(--night-2);border:3px solid var(--line);touch-action:none;-webkit-user-select:none;user-select:none}
.lvl-ctrl button.big{flex:1.6;background:var(--holly);color:#fff;border-color:transparent;font-size:1.6rem}
.lvl-ctrl button.on{transform:scale(.95);border-color:var(--gold)}
.lvl-ctrl.maze{display:grid;grid-template-columns:repeat(4,1fr)}
/* Sidekick screens: one fixed screen, no scrolling */
body.kidmode{overflow:hidden}
body.kidmode .wrap{max-width:none;padding-block:8px;height:100dvh;height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:0}
@supports (height:100dvh){ body.kidmode .wrap{height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))} }
.kid{height:100%;display:flex;flex-direction:column;gap:8px;min-height:0;--avail:calc(100dvh - 130px)}
.kbar{display:flex;align-items:center;gap:12px;flex:none;position:relative;z-index:5}
.boss-face.kface{width:84px;height:84px;padding:0;border:0;cursor:pointer;position:relative;font-size:2.6rem;overflow:visible;flex:none}
.boss-face.kface .art,.boss-face.kface .portrait{width:100%;height:100%;border-radius:50%;overflow:hidden;display:block}
.boss-face.kface .waves{right:-26px}
.ktitle{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.ktitle h2{font-size:clamp(1.3rem,3.2vw,2rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kdots{display:flex;flex-wrap:wrap;gap:4px}
.kdots i{width:12px;height:12px;border-radius:50%;background:var(--night-3);border:2px solid var(--line)}
.kdots i.a{border-radius:3px}
.kdots i.d{background:var(--mint);border-color:transparent}
.kdots i.n{background:var(--gold);border-color:#fff;transform:scale(1.3)}
.kbtns{display:flex;gap:6px;flex:none}
.kbtns button{width:54px;height:54px;border-radius:16px;background:var(--night-2);border:2px solid var(--line);font-size:1.6rem;padding:0}
.kmain{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;position:relative;z-index:1}
.kmain>*{max-width:100%}
.kid .mem{width:min(100%, 620px, calc(var(--avail) * 1.0))}
.kid .simon{width:min(100%, 420px, calc(var(--avail) - 90px))}
.kid .find{width:min(100%, 560px, calc(var(--avail) - 40px))}
.kid .snowgrid{width:min(100%, 440px, calc((var(--avail) - 130px) * .9))}
.kid .lgrid{width:min(100%, 360px, calc(var(--avail) - 220px))}
.kid .nums{width:min(100%, 420px)}
.kid .helpcard{padding:10px 14px;gap:6px;flex-direction:row;flex-wrap:wrap;justify-content:center;max-width:720px}
.kid .helpcard .grownup{font-size:1.15rem}
.kid .helpcard>span:not(.grownup){font-size:.9rem}
.kid .helpcard #peek{padding:6px 14px}
.kid .lvl{width:auto;max-width:100%;align-items:center}



.kid .lvl{width:100%;max-width:none;flex:1;min-height:0;justify-content:center}
.kid .lvl canvas{max-width:100%}
.kid .kmain:has(.lvl){justify-content:flex-start}

.kid .lvl-bar{width:100%}
.kid .lvl-ctrl{width:100%}
.kid .lvl-ctrl button{min-height:64px}
.kid .choices button{width:clamp(70px,14vh,110px)}
.kid .globe{width:min(46vh,260px)}
.kid .slot{width:clamp(54px,10vh,80px)}
.diffbtn{background:var(--night-2);border:3px solid var(--line);border-radius:999px;padding:10px 18px;font-weight:900;font-size:1.1rem}

function makeClues(boss){
  let cands = VILLAINS.slice(); const clues = []; const keys = Object.keys(ATTRS).sort(() => Math.random() - .5);
  for(const k of keys){
    if(clues.length === 3) break;
    const val = boss[k]; const left = cands.filter(v => v[k] === val);
    if(left.length < cands.length && left.length >= 2){ cands = left; clues.push({ e:ATTRS[k].e, text: val ? ATTRS[k].yes : ATTRS[k].no }); }
  }
  for(const k of keys){ if(clues.length >= 3) break; if(!clues.some(c => c.e === ATTRS[k].e)) clues.push({ e:ATTRS[k].e, text: boss[k] ? ATTRS[k].yes : ATTRS[k].no }); }
  clues.push({ e:"⭐", text: boss.sig });
  return clues;
}

function shrink(file){
  return new Promise((res) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const m = 512, sc = Math.min(1, m / Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc); c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); c.toBlob(b => res(b || file), "image/jpeg", .85); };
    img.onerror = () => { URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}

function makeSecret(kind){
  if(kind === "code") return { kind, data: shuffle([0,1,2,3,4,5]).slice(0,4) };
  if(kind === "snowman") return { kind, data: Math.floor(Math.random()*9) };
  if(kind === "lights"){ const d = Array(9).fill(0); shuffle([0,1,2,3,4,5,6,7,8]).slice(0,3).forEach((i,k) => d[i] = (k % 3) + 1); return { kind, data: d }; }
  return null;
}

  if(!sec) return "";
  if(sec.kind === "code") return `<p><b>Tell the sidekick these 4 pictures, in this order:</b></p><div class="slots">${sec.data.map(i=>`<span class="slot">${CODE_SET[i]}</span>`).join("")}</div><p class="small">Say them one at a time: “First a present…”</p>`;
  if(sec.kind === "snowman"){ const c = SNOW_COMBOS[sec.data]; return `<p><b>Describe this snowman. Don't point!</b></p>${snowmanSVG(c, true)}<p class="small">Hat: <b>${HAT_COLS[c.hat][0]}</b> · Buttons: <b>${c.buttons}</b></p>`; }
  if(sec.kind === "lights") return `<p><b>Tell the sidekick which squares light up, and their colours:</b></p><div class="lgrid" style="max-width:220px;pointer-events:none">${sec.data.map(v=>`<span style="background:${v?LIGHT_COLS[v]:"transparent"}" class="${v?"on":""}"></span>`).join("")}</div><p class="small">${sec.data.map((v,i)=>v?`${["top","top","top","middle","middle","middle","bottom","bottom","bottom"][i]} ${["left","middle","right"][i%3]}: ${LIGHT_NAMES[v]}`:"").filter(Boolean).join(" · ")}</p>`;
  return "";
}
function helpBanner(){
  return `<div class="helpcard"><span class="grownup">🧑 Team puzzle: get a grown-up!</span><span>The grown-up sees the secret on the detectives' phone. No phone? A grown-up can peek here.</span><button class="btn-ghost" id="peek" style="color:#16213a;border-color:#16213a">👀 Grown-up peek</button></div>`;
}
function wirePeek(el){
  const b = el.querySelector("#peek"); if(!b) return;
  b.onclick = () => {
    $ov.innerHTML = `<div class="ov"><div class="ov-in"><h2>🙈 Sidekick, look away!</h2><div class="helpcard">${secretHTML(S.secret)}</div><button class="btn-gold" id="peekx" style="font-size:1.3rem">Hide it</button></div></div>`;
    document.getElementById("peekx").onclick = () => { $ov.innerHTML = ""; };
  };
}

const headImgs = {};
function headImg(key){
  if(headImgs[key]) return headImgs[key];
  const img = new Image();
  img.src = ART[key] || ("data:image/svg+xml;charset=utf-8," + encodeURIComponent(PORTRAITS[key].replace("<svg ", '<svg xmlns="http://www.w3.org/2000/svg" ')));
  return headImgs[key] = img;
}
function drawHead(ctx, key, x, y, r){
  const img = headImg(key);
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.closePath();
  ctx.fillStyle = vByKey(key).hex; ctx.fill(); ctx.clip();
  if(img.complete && img.naturalWidth) ctx.drawImage(img, x - r, y - r, r*2, r*2);
  ctx.restore();
  ctx.lineWidth = 3; ctx.strokeStyle = "#fff"; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.stroke();
  const gi = gearImg(key); if(gi && gi.complete && gi.naturalWidth){ const u = 2*r/100; ctx.drawImage(gi, x - r, y - r - 60*u, 2*r, 160*u); }
}
function emoji(ctx, ch, x, y, size){ const fs = ctx.fillStyle; ctx.fillStyle = "#000"; ctx.font = `${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(ch, x, y); ctx.fillStyle = fs; }
function nightSky(ctx, t){
  const g = ctx.createLinearGradient(0,0,0,LH); g.addColorStop(0,"#0b1430"); g.addColorStop(1,"#1d2d55"); ctx.fillStyle = g; ctx.fillRect(0,0,LW,LH);
  ctx.fillStyle = "rgba(255,255,255,.7)"; for(let i=0;i<40;i++){ const x = (i*97 + t*8) % LW, y = (i*53) % (LH*0.7); ctx.fillRect(x, y, 2, 2); }
}

function toHenry(id, t){

  if(/^lv_/.test(id)) return t.replace(/^Action time!/, `Action time, ${K}!`);
  if(/^good/.test(id)) return `${K}! ` + t;
  if(/^oops/.test(id) || id === "watch" || id === "askagain") return t.replace(/[.!]\s*$/, `, ${K}!`);
  if(/^joke/.test(id)) return `Hey ${K}! ` + t;
  if(id === "boss") return t.replace(/^Mission one!/, `${K}! Mission one!`);
  if(/^(memory|simon|find|pattern)$/.test(id)) return `Puzzle time, ${K}! ` + t.replace(/^Mission (one|two|three|four)! /, "");
  if(id === "final") return t.replace(/^Uh oh!/, `Uh oh, ${K}!`);
  if(id === "finale") return t.replace(/^There it is!/, `There it is, ${K}!`);
  return t;
}

}
function clipUrl(name, id, b64){
  const k = name + "/" + id; if(CLIPURL[k]) return CLIPURL[k];
  const bin = atob(b64), u8 = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
  return CLIPURL[k] = URL.createObjectURL(new Blob([u8], { type:"audio/mpeg" }));
}
let playToken = 0;
async function playLine(key, id, fromChain){
  const text = linesFor(key)[id]; if(!text) return;
  lastId = id; lastKey = key; const my = ++playToken;
  showSay(fromChain ? (lastSay + " " + text) : text);
  try{ window.speechSynthesis && speechSynthesis.cancel(); }catch(e){} try{ tts && tts.stop(); }catch(e){}
  try{ player.pause(); }catch(e){}
  const name = id === "pick" ? "picks" : key;
  const bundle = await Promise.race([loadBundle(name), new Promise(r => setTimeout(() => r(undefined), 9000))]);
  if(my !== playToken) return;
  let b64 = bundle && (id === "pick" ? bundle[key] : bundle[id]);
  if(bundle && bundle[id + "_p"] && Math.random() < .5) b64 = bundle[id + "_p"];   /* sometimes without Henry's name */
  if(!b64){ speakAs(key, text); return; }
  player.onerror = () => { setTalking(false); speakAs(key, text); };
  player.src = clipUrl(name + "/" + key, id + (b64 === (bundle && bundle[id]) ? "" : "_p"), b64);
  const pr = player.play(); if(pr && pr.catch) pr.catch(() => { speakAs(key, text); });
}
function bossKeyNow(){ return S.bossKey || det.pick; }
function say(id){ chain = []; playLine(bossKeyNow(), id); }
function sayChain(ids){ chain = ids.slice(1); playLine(bossKeyNow(), ids[0]); }
function pickVar(prefix){ const o = linesFor(bossKeyNow()); const ks = Object.keys(o).filter(k => k.startsWith(prefix) && /\d$/.test(k)); return ks[Math.floor(Math.random()*ks.length)]; }
let funBag = [];
function tapBoss(){
  if(!funBag.length){ const o = linesFor(bossKeyNow()); funBag = shuffle(Object.keys(o).filter(k => /^(fact|joke)\d$/.test(k)).concat(["about"])); }
  const id = funBag.pop(); sfx("popup", .3);
  const el = document.getElementById("bossface"); if(el){ el.classList.remove("boing"); void el.offsetWidth; el.classList.add("boing"); }
  say(id);
}
function sayThen(id, cb){
  const text = linesFor(bossKeyNow())[id] || ""; let fired = false;
  const fire = () => { if(fired) return; fired = true; if(doneCb === fire) doneCb = null; cb(); };
  say(id); doneCb = fire;
  setTimeout(fire, 2500 + text.length * 90);
}
function sayAny(prefix){ say(pickVar(prefix)); }
function hushAll(){ chain = []; try{ player.pause(); }catch(e){} hush(); }

let trapActive = false;
function onRemote(){
  if(false){
    const pending = (remote.traps || []).map(t => typeof t === "string" ? { id:t, type:"snow" } : t).filter(t => !S.trapsDone.includes(t.id));
    if(pending.length && !trapActive && !$ov.innerHTML && !["finale","action","final"].includes(STEPS[S.step].kind)) runTrap(pending[0].id, pending[0].type);
  }
  if(S.mode === "kid" && S.done){ const p = document.querySelector(".win"); if(p) render(); }
  if(S.mode === "det") renderDet();
}
function finishTrap(id){
  if(S.trapsDone.includes(id)) return;
  S.trapsDone.push(id); pushKid(); chime();
  setTimeout(() => { $ov.innerHTML = ""; trapActive = false; say("trapdone"); onRemote(); }, 900);
}
function runTrap(id, type){
  trapActive = true; const C = CHALLENGES[type] || CHALLENGES.snow;
  sfx("alarm", .6);
  const shell = inner => `<div class="ov"><div class="ov-in"><h2>${C.e} ${esc(C.name)}</h2><p style="font-weight:700">A challenge from the detectives!</p>${inner}<button class="btn-ghost small" id="tskip" style="opacity:.6">Grown-up: skip</button></div></div>`;
  say("ch_" + (CHALLENGES[type] ? type : "snow"));
  const pos = n => Array.from({length:n}, () => ({ x: 5 + Math.random()*78, y: 5 + Math.random()*72 }));
  if(type === "freeze"){
    $ov.innerHTML = shell(`<div style="font-size:7rem;line-height:1">🧍</div><div class="win" id="cd">5</div>`);
    let n = 5; const t = setInterval(() => { n--; const el = document.getElementById("cd"); if(el) el.textContent = n || "Phew!"; tone(n ? 440 : 880, 150, "triangle"); if(n <= 0){ clearInterval(t); finishTrap(id); } }, 1400);
    setTimeout(()=>{}, 0);
  } else if(type === "dark"){
    const st = pos(5); let left = 5;
    $ov.innerHTML = shell(`<div class="trapfield" style="background:#000">${st.map((b,i)=>`<button class="ball" data-b="${i}" style="left:${b.x}%;top:${b.y}%;filter:drop-shadow(0 0 10px #f2c14e)" aria-label="Star">⭐</button>`).join("")}</div>`);
    $ov.querySelectorAll(".ball").forEach(b => b.onclick = () => { if(b.dataset.gone) return; b.dataset.gone = 1; b.textContent = "💡"; tone(600 + (5-left)*120, 140, "triangle"); left--; if(!left) finishTrap(id); });
  } else if(type === "dog"){
    let fed = 0;
    $ov.innerHTML = shell(`<div style="font-size:7rem;line-height:1" id="dogf">🐶</div><p id="dogc" style="font-size:2rem">${"⬜".repeat(5)}</p><button class="choices" id="cookie" style="background:none;font-size:5rem" aria-label="Give a cookie">🍪</button>`);
    document.getElementById("cookie").onclick = () => { if(fed >= 5) return; fed++; tone(500 + fed*90, 140, "triangle"); document.getElementById("dogc").textContent = "🍪".repeat(fed) + "⬜".repeat(5-fed); if(fed === 5){ document.getElementById("dogf").textContent = "😴"; finishTrap(id); } };
  } else {
    const balls = pos(8); let left = 8;
    $ov.innerHTML = shell(`<div class="trapfield">${balls.map((b,i)=>`<button class="ball" data-b="${i}" style="left:${b.x}%;top:${b.y}%" aria-label="Snowball">⚪</button>`).join("")}</div>`);
    $ov.querySelectorAll(".ball").forEach(b => b.onclick = () => { if(b.dataset.gone) return; b.dataset.gone = 1; b.textContent = "💧"; tone(700 + left*40, 120, "triangle"); left--; if(!left) finishTrap(id); });
  }
  document.getElementById("tskip").onclick = () => finishTrap(id);
}

/* ask the boss */
let asking = false;
const SCRIPTED = {
  help: () => linesFor(S.bossKey)[stepLine(STEPS[Math.max(0,S.step)])] || bossLine("intro"),
  joke: () => ["Why did the snowman look through the carrots? He was picking his nose! Ha ha!","What do you call a reindeer with no eyes? No idea! Ha!","Why was Santa's helper sad? Because he had low elf-esteem! Bwa ha ha!"][Math.floor(Math.random()*3)],
  about: () => `I am ${boss().name}! ${boss().catch} I am the sneakiest boss in the world, and you are my favourite sidekick!`,
  hard: () => `Don't worry, sidekick. Take a deep breath. Ask a grown-up to help you, or tap the help button. We've got all the time in the world!`
};
async function askBoss(kind, spoken){
  if(asking) return;
  if(!spoken){
    const st = S.step >= 0 ? STEPS[Math.min(S.step, STEPS.length-1)] : null;
    if(kind === "help"){ if(silentStep(st)) return; return say(stepLine(st)); }
    if(kind === "joke") return sayAny("joke");
    return say(kind);
  }
  const fallback = () => speak(SCRIPTED[kind] ? SCRIPTED[kind]() : SCRIPTED.help());
  if(!sample) return fallback();
  asking = true; showSay("…"); setTalking(true);
  const st = S.step >= 0 ? STEPS[Math.min(S.step, STEPS.length-1)] : null;
  const ask = spoken ? `The sidekick says: "${spoken}"` : ({ help:"The sidekick tapped HELP. Explain simply what to do on this screen.", joke:"The sidekick wants a joke. Tell one short, silly, Christmas or villain joke.", about:"The sidekick wants you to tell them something fun about yourself.", hard:"The sidekick says it's too hard. Encourage them warmly and give one very simple tip." })[kind];
  const prompt = `You are ${boss().name}, a cartoon villain, talking out loud (text-to-speech) to your sidekick: a 7-year-old autistic boy who loves villains and cannot read yet. Personality: ${boss().style}. Catchphrase: "${boss().catch}".
You are both on a funny Christmas heist to steal Santa's Magic Snowglobe. It's all pretend and kind: nobody gets hurt, nothing scary.
RULES: 1 to 3 short sentences, under 45 words. Simple, concrete, literal words. No sarcasm, no idioms that could confuse. Never ask him to read. Be warm and proud of him. Plain text only, no emoji, no stage directions.
Current screen: ${st ? `${st.title}. How to do it: ${linesFor(S.bossKey)[stepLine(st)] || ""}` : "the start of the heist."}
${ask}`;
  try{
    const { text } = await sample(prompt, { cache:false, modelTier:"quick" });
    asking = false; speak(text.trim());
  }catch(e){ asking = false; fallback(); }
}

/* dictation */
let listening = false, heard = "";
function wireDict(){
  dict.onFinal(({text}) => { heard = (heard + " " + text).trim(); });
  dict.onPartial(({text}) => showSay("🎤 " + (heard + " " + text).trim()));
  dict.onState(({state}) => { listening = state === "listening" || state === "starting"; const m = document.getElementById("t-mic"); if(m){ m.classList.toggle("on", listening); m.innerHTML = `<span>🎤</span>${listening?"Done":"Talk"}`; } });
}
function toggleMic(){
  if(!dict) return;
  if(listening){ dict.stop().then(() => { const t = heard.trim(); heard = ""; if(t) askBoss("help", t); }).catch(()=>{}); return; }
  hush(); heard = "";
  dict.start({ language:"en" }).catch(e => { if(e && e.code === "not_granted"){ dict = null; refreshTalk(); } });
  showSay("🎤 I'm listening, sidekick!");
}

/* ============ Detectives ============ */
let santaBusy = false;
function renderDet(){
  if(S.mode !== "det") return;
  const live = remote && remote.gameId;
  if(live && Array.isArray(remote.plan)) STEPS = remote.plan;
  if(live && det.gameId !== remote.gameId){ det = { out:{}, gameId:remote.gameId, chat:[], pick:null }; }
  const step = live ? remote.step : -1;
  const n = live ? (remote.cluesUnlocked || 0) : 0;
  const traps = live ? (remote.traps || []) : [];
  const guess = live && remote.guess ? vByKey(remote.guess) : null;
  const done = live && remote.done;
  const b = live ? vByKey(remote.boss) : null;
  const scrollY = window.scrollY;
  $app.innerHTML = `
    <header style="display:flex;flex-direction:column;gap:6px">
      <span class="muted small"><span class="status-dot ${syncOK?"":"off"}"></span>${syncOK ? (live ? "Connected to the sidekick's iPad" : "Waiting for the sidekick to start a heist on the iPad") : (db ? "Connecting…" : "Not synced. Open this page on a device signed in to your Claude account.")}</span>
      <h1 style="font-size:clamp(2rem,7vw,3rem)">🕵️ Detectives' Board</h1>
      <p class="muted">A secret villain and their sidekick are stealing Santa's Magic Snowglobe. Work out which villain is the boss!</p>
    </header>
    <section class="panel">
      <h3>The heist so far</h3>
      <div class="map">${STEPS.map((s,i)=>`${i?'<span class="dash"></span>':""}<span class="stop ${i<step||done?"done":""} ${i===step&&!done?"now":""} ${s.help?"help":""}">${i<step||done?"✓":s.icon}</span>`).join("")}</div>
      <p>${!live ? "The heist hasn't started yet." : done ? "🚨 Too late! The snowglobe has been stolen!" : step < 0 ? "The boss is giving the sidekick their orders…" : `The sidekick is on: <b>${esc(STEPS[step].title)}</b>${STEPS[step].help?" (they need a grown-up's help!)":""}`}</p>
    </section>
    ${done ? detReveal(b, guess) : ""}
    ${!done && live && remote.secret && remote.secret.step === step ? `<section class="panel" style="border-color:var(--gold)"><h3>🆘 The sidekick needs a grown-up!</h3><p class="muted small">Help him and you earn a clue. Hand-hold the phone so he can't see the screen.</p><div class="helpcard">${secretHTML(remote.secret)}</div></section>` : ""}
    <div class="dgrid">
      <section class="panel">
        <h3>Clues (${n} of 4)</h3>
        <p class="muted small">You get a clue each time a grown-up helps the sidekick with a team puzzle (the dashed circles).</p>
        <div class="cluelist">${[0,1,2,3].map(i => live && i < n && remote.clues[i] ? `<div class="clue"><span class="ce">${remote.clues[i].e}</span><b>${esc(remote.clues[i].text)}</b></div>` : `<div class="clue locked"><span class="ce">🔒</span>Help the sidekick to unlock this clue.</div>`).join("")}</div>
      </section>
      <section class="panel">
        <h3>The suspects</h3>
        <p class="muted small">Tap a villain to cross them off.</p>
        <div class="sus">${VILLAINS.map(v=>`<button data-v="${v.key}" class="${det.out[v.key]?"out":""}" style="background:${v.hex}">${face(v)}${esc(v.name)}</button>`).join("")}</div>
      </section>
    </div>
    <section class="panel">
      <h3>🚧 Send a challenge (${Math.max(0, 4 - traps.length)} left)</h3>
      <p class="muted small">Slow the sidekick down! The challenge pops up on the iPad and the boss explains it. Each one takes under a minute and he can't fail it.</p>
      <div class="sus">${Object.entries(CHALLENGES).map(([k,c])=>`<button data-ch="${k}" style="background:var(--night-3)" ${!live||done||traps.length>=4||step<0?"disabled":""}><span class="e">${c.e}</span>${esc(c.name)}<span class="small" style="font-weight:400">${esc(c.desc)}</span></button>`).join("")}</div>
    </section>
    <section class="panel">
      <h3>🎅 Call Santa for a hint</h3>
      <div class="chat" id="chat">${det.chat.map(m=>`<div class="bub ${m.role==="assistant"?"s":"m"}">${esc(m.content)}</div>`).join("") || `<p class="muted small">Santa knows who the boss is. He won't just tell you, but he gives good hints.</p>`}</div>
      <div class="row">${dict?`<button class="btn-ghost" id="santa-mic">🎤 Talk</button>`:""}<textarea id="santa-q" placeholder="Ask Santa something…" style="flex:1 1 200px"></textarea><button class="btn-gold" id="santa-send" ${santaBusy||!live?"disabled":""}>Ask</button></div>
    </section>
    <section class="panel">
      <h3>🔎 Final guess</h3>
      ${guess ? `<p>You guessed <b>${esc(guess.name)}</b> ${guess.e}. ${done ? "" : "The answer comes when the heist ends!"}</p>` :
      `<p class="muted small">You only get one guess. Pick a villain, then lock it in.</p>
       <div class="sus">${VILLAINS.map(v=>`<button data-g="${v.key}" style="background:${v.hex}" aria-pressed="${det.pick===v.key}">${face(v)}${esc(v.name)}</button>`).join("")}</div>
       <div class="row"><button class="btn" id="lock" ${!det.pick||!live?"disabled":""}>Lock in our guess</button></div>`}
    </section>
    <div class="row"><button class="btn-ghost small" id="to-modes">← Switch mode</button></div>`;
  window.scrollTo({ top: scrollY });
  document.querySelectorAll("[data-v]").forEach(x => x.onclick = () => { det.out[x.dataset.v] = !det.out[x.dataset.v]; saveLocal(); renderDet(); });
  document.querySelectorAll("[data-g]").forEach(x => x.onclick = () => { det.pick = x.dataset.g; saveLocal(); renderDet(); });
  const lk = document.getElementById("lock"); if(lk) lk.onclick = () => { push({ guess: det.pick }); };
  document.querySelectorAll("[data-ch]").forEach(x => x.onclick = () => { if(traps.length >= 4) return; push({ traps: [...traps, { id:"t" + Date.now(), type:x.dataset.ch }] }); document.querySelectorAll("[data-ch]").forEach(y => y.disabled = true); });
  document.getElementById("to-modes").onclick = () => { S.mode = null; render(); };
  const q = document.getElementById("santa-q");
  document.getElementById("santa-send").onclick = () => askSanta(q.value);
  const sm = document.getElementById("santa-mic"); if(sm) sm.onclick = () => {
    if(listening){ dict.stop().then(() => { const t = heard.trim(); heard = ""; if(t) askSanta(t); }).catch(()=>{}); sm.textContent = "🎤 Talk"; return; }
    hush(); heard = ""; dict.start({ language:"en" }).catch(()=>{}); sm.textContent = "■ Done";
  };
  const ch = document.getElementById("chat"); if(ch) ch.scrollTop = ch.scrollHeight;
}
function detReveal(b, guess){
  if(!b) return "";
  const right = guess && guess.key === b.key;
  return `<section class="panel" style="border-color:var(--gold)">
    <h2 style="color:var(--gold)">The boss was ${esc(b.name)} ${b.e}!</h2>
    <p>${guess ? (right ? "You guessed right! But the sidekick still got away with the snowglobe. Better luck next Christmas, detectives!" : `You guessed ${esc(guess.name)}. The sidekick fooled you all!`) : "You never made a guess! The sidekick fooled you all!"}</p>
    <p>Give the sidekick a big round of applause. 👏</p>
  </section>`;
}
async function askSanta(text){
  text = (text || "").trim(); if(!text || santaBusy || !remote) return;
  det.chat.push({ role:"user", content:text });
  const b = vByKey(remote.boss); const n = remote.cluesUnlocked || 0;
  if(!sample){ const r = n < 4 ? "Ho ho ho! Help the sidekick with the next tricky door, and you'll get another clue. Look at your clues and cross off every villain who doesn't match!" : "Ho ho! You have all four clues. Cross off every villain that doesn't match them all!"; det.chat.push({ role:"assistant", content:r }); renderDet(); speak(r, "rounded"); return; }
  santaBusy = true; det.chat.push({ role:"assistant", content:"…" }); renderDet();
  const brief = `You are Santa Claus giving hints, out loud, to grown-up detectives in a family Christmas game, "The Snowglobe Heist". A 7-year-old (the sidekick, on an iPad) is helping a secret villain boss steal Santa's Magic Snowglobe. The grown-ups must guess which villain is the boss from: ${VILLAINS.map(v=>v.name).join(", ")}.
SECRET: the boss is ${b.name} (colour ${b.colour}; ${Object.keys(ATTRS).map(k=>`${k}: ${b[k]?"yes":"no"}`).join(", ")}).
Clues the detectives have so far: ${(remote.clues||[]).slice(0,n).map(c=>c.text).join(" ") || "none yet"}.
Heist progress: step ${Math.max(0,remote.step)+1} of ${STEPS.length}.
RULES: Never say the boss's name or give a hint that singles them out completely. Give one gentle, fun hint that removes at most one or two wrong suspects, or remind them to help the sidekick to earn clues. Jolly, 1 to 3 sentences, under 50 words, plain text, no emoji. The sidekick may be listening, so keep it kind and never spoil things for him.`;
  const convo = det.chat.slice(0,-1).map(m => ({ role:m.role, content:m.content }));
  convo[0] = { role:"user", content: brief + "\n\nDetective says: " + convo[0].content };
  try{
    const { text: a } = await sample(convo, { cache:false });
    det.chat[det.chat.length-1].content = a.trim(); santaBusy = false; saveLocal(); renderDet(); speak(a.trim(), "rounded");
  }catch(e){
    det.chat[det.chat.length-1].content = "Ho ho! The line is crackly. Help the sidekick with the next tricky door, and you'll earn a clue!"; santaBusy = false; renderDet();
  }
}

/* ============ Snow + burst ============ */
let flakes = [], W, H, ctx, extra = 0;
(function(){
  const c = document.getElementById("snow"); ctx = c.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){ W = c.width = innerWidth; H = c.height = innerHeight; flakes = Array.from({length:Math.min(80, Math.floor(W/14))}, mk); }
  function mk(){ return { x:Math.random()*W, y:Math.random()*H, r:Math.random()*2.2+.6, s:Math.random()*.6+.25, d:Math.random()*6, c:null }; }
  function draw(){ ctx.clearRect(0,0,W,H);
    for(const f of flakes){ ctx.fillStyle = f.c || "rgba(238,244,251,.7)"; ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,7); ctx.fill();
      if(!reduce){ f.y += f.s; f.d += .01; f.x += Math.sin(f.d)*.3; if(f.y > H+4){ if(f.c){ f.dead = 1; } f.y = -4; f.x = Math.random()*W; } } }
    flakes = flakes.filter(f => !f.dead);
    if(!reduce) requestAnimationFrame(draw); }
  window.burst = () => { if(reduce) return; const cols = ["#f2c14e","#d33a3a","#5fd3a5","#ffffff"]; for(let i=0;i<120;i++) flakes.push({ x:Math.random()*W, y:-Math.random()*H*.5, r:Math.random()*3+2, s:Math.random()*2+1.5, d:Math.random()*6, c:cols[i%4] }); };
  addEventListener("resize", size); size(); draw();
})();
const burst = () => window.burst && window.burst();

/* ============ Boot ============ */
function start(data){
  if(data && data.S){ S = data.S; det = data.det || det; } else loadLocal();
  if(!S.diff) S.diff = loadDiff();
  if(S.plan && S.plan.some(p => p.kind === "action" && p.lv === undefined)) S.plan = null;
  if(S.plan) STEPS = S.plan; else if(S.bossKey){ S.plan = makePlan(S.bossKey); STEPS = S.plan; }
  render();
}
window.claude?.hot?.snapshot?.(() => ({ S, det }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
